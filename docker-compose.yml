# One-command self-host:
#   docker compose up --build
# Set TAKAN_OWNER_EMAIL, then open http://localhost:8090 and sign in with an emailed code.
#
# On a LAN or behind TLS, set TAKAN_PUBLIC_URL to the URL browsers and MCP clients use:
#   TAKAN_PUBLIC_URL=https://takan.example.com docker compose up --build
#
# Optional: pin the session key (otherwise it is generated into the data volume):
#   ATLAS_SESSION_KEY=$(openssl rand -hex 32) docker compose up --build
#
# The assistant (Telegram bot + phone app) is off in this image unless you set
# TELEGRAM_BOT_TOKEN and OWNER_TELEGRAM_ID. It also wants a CLI coding agent on
# PATH, which this image does not ship: for the assistant, prefer the systemd
# install (deploy/takan.service), where it runs as a user with a real home and
# its own agent credentials.

services:
  takan:
    build: .
    image: takan:local
    ports:
      - "8090:8090"
    environment:
      TAKAN_LISTEN: "0.0.0.0:8090"
      TAKAN_PUBLIC_URL: "${TAKAN_PUBLIC_URL:-http://localhost:8090}"
      TAKAN_DATA_DIR: /data
      TAKAN_AGENT_BIN_DIR: /opt/takan/agents
      TAKAN_SESSION_KEY: "${ATLAS_SESSION_KEY:-${TAKAN_SESSION_KEY:-}}"
      # Assistant. Leave unset to run as a plain MCP hub.
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      OWNER_TELEGRAM_ID: "${OWNER_TELEGRAM_ID:-}"
      # Loopback API for atlas-send / atlas-sched / atlas-task, inside the container.
      ATLAS_LOCAL_ADDR: "127.0.0.1:8099"
    volumes:
      - takan-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  takan-data:

[instance]
name = "Atlas"
respond_to_all = false

[agent]
command = "grok"
args = ["--single", "{prompt}", "--output-format", "plain", "--always-approve"]
new_session_args = ["--session-id", "{session}"]
resume_args = ["--resume", "{session}"]
fork_args = ["--resume", "{parent}", "--fork-session", "--session-id", "{session}"]
soft_timeout = "90s"
task_timeout = "2h"
continue_session = true
unset_env = ["XAI_API_KEY"]

[agent.env]

[telegram]
poll_timeout = "45s"
typing_interval = "6s"
